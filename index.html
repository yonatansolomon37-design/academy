<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLOMON DIGITAL ACADEMY</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#1f2a44; color:#fff;
           display:flex; align-items:center; justify-content:center;
           min-height:100vh; margin:0; padding:16px; text-align:center; }
    .card { background:#2b3a5c; padding:28px; border-radius:16px; max-width:420px; width:100%; }
    a.btn { display:inline-block; margin-top:16px; padding:14px 28px; border-radius:10px;
            background:#f59e0b; color:#1f2a44; font-weight:700; text-decoration:none; }
    small { color:#cbd5e1; display:block; margin-top:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>SOLOMON DIGITAL ACADEMY</h2>
    <p id="msg">እየጫነ ነው...</p>
    <a id="go" class="btn" style="display:none" href="#">ወደ አካዳሚው ግባ</a>
    <small>ክፍት ሰዓት፦ ጧት 2:00 - ምሽት 5:00</small>
  </div>
  <script>
    fetch('link.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var url = (d && d.url ? String(d.url) : '').replace(/\/+$/, '');
        if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(url)) {
          throw new Error('no link');
        }
        var target = url + '/accounts/login/';
        document.getElementById('msg').textContent = 'ወደ መግቢያ ገጽ እያስገባዎት ነው...';
        var a = document.getElementById('go');
        a.href = target; a.style.display = 'inline-block';
        setTimeout(function () { location.href = target; }, 1000);
      })
      .catch(function () {
        document.getElementById('msg').textContent =
          'ሲስተሙ ለጊዜው ዝግ ነው። በክፍት ሰዓት (ጧት 2:00 - ምሽት 5:00) እንደገና ይሞክሩ።';
      });
  </script>
</body>
</html>
